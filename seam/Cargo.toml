[package]
name = "seam-spsc"
version = "0.1.0"
edition = "2021"
description = "One seam: an SPSC lock-free ring buffer re-exported as a checked safe interface, built on the stipulated NLL floor (real rustc)."
publish = false

[lib]
name = "seam_spsc"
path = "src/lib.rs"

[features]
# The sixteenth seam (`lock_registry`) is a RUNTIME lock-order registry (lockdep-in-miniature).
# It needs OS thread-local storage, so — unlike every other seam — it CANNOT be `no_std`. Gating
# it behind a feature makes that bare-metal (#5) cost *structural and visible in the build config*:
# `cargo test --features lockdep`. The default build stays `no_std`.
lockdep = []

# The MMIO seam (#2) vends two `__`-prefixed test helpers. They must be `pub` for the
# integration test (an external crate) to reach them, and being `pub` is exactly what
# breaks the seam's soundness argument: `__reset_for_test` clears the `TAKEN` singleton
# while a `StatusReg` may still be live, and M3 (at-most-one-owner) is the SOLE discharge
# for `unsafe impl Sync for Mmio`. `__device_raise` races the region with no handle at all.
# Gating them keeps the default build's public surface sound, and makes the test-only
# escape hatch structural and visible in the build config, exactly as `lockdep` does.
test-helpers = []

[profile.test]
opt-level = 0
